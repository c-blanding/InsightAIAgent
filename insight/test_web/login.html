<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>LumenShop — Login</title>
    <link rel="stylesheet" href="/css/styles.css" />
  </head>
  <body>
    <header class="site-header">
      <div class="container nav">
        <a class="brand" href="/">LumenShop</a>
        <button class="menu-toggle" type="button" data-menu-toggle>Menu</button>
        <ul class="nav-links" data-nav-links>
          <li><a href="/">Home</a></li>
          <li><a href="/products.html">Products</a></li>
          <li><a href="/cart.html">Cart <span class="cart-badge" data-cart-count>0</span></a></li>
          <li><a href="/login.html">Login</a></li>
          <li><a href="/contact.html">Contact</a></li>
        </ul>
      </div>
    </header>

    <main class="container section">
      <div class="section-header">
        <div>
          <h2>Sign in</h2>
          <p>Demo account: <code>demo@lumenshop.test</code> / <code>password123</code></p>
        </div>
      </div>

      <div class="panel" style="max-width: 480px">
        <div class="alert hidden" data-login-alert></div>
        <form class="form-grid" data-login-form>
          <label>
            Email
            <input name="username" type="email" required autocomplete="username" />
          </label>
          <label>
            Password
            <input name="password" type="password" required autocomplete="current-password" />
          </label>
          <div class="form-actions">
            <button class="btn btn-primary" type="submit">Sign in</button>
            <!-- BUG 20: forgot password goes to missing route -->
            <a href="/reset-password">Forgot password?</a>
          </div>
        </form>
      </div>
    </main>

    <footer class="footer">
      <div class="container">© LumenShop test store — not a real shop.</div>
    </footer>
    <script src="/js/app.js"></script>
  </body>
</html>
