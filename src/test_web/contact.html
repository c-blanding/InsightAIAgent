<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>LumenShop — Contact</title>
    <link rel="stylesheet" href="/css/styles.css" />
  </head>
  <body>
    <header class="site-header">
      <div class="container nav">
        <a class="brand" href="/">LumenShop</a>
        <button class="menu-toggle" type="button" data-menu-toggle>Menu</button>
        <ul class="nav-links" data-nav-links>
          <li><a href="/">Home</a></li>
          <li><a href="/products.html">Products</a></li>
          <li><a href="/cart.html">Cart <span class="cart-badge" data-cart-count>0</span></a></li>
          <li><a href="/login.html">Login</a></li>
          <li><a href="/contact.html">Contact</a></li>
        </ul>
      </div>
    </header>

    <main class="container section">
      <div class="section-header">
        <div>
          <h2>Contact support</h2>
          <p>Send a message — watch the network tab and UI feedback carefully.</p>
        </div>
      </div>

      <div class="panel" style="max-width: 640px">
        <div class="alert hidden" data-contact-alert></div>
        <form class="form-grid" data-contact-form>
          <label>
            Name
            <input name="name" type="text" required />
          </label>
          <label>
            Email
            <input name="email" type="email" required />
          </label>
          <label>
            Message
            <textarea name="message" required placeholder="How can we help?"></textarea>
          </label>
          <div class="form-actions">
            <button class="btn btn-primary" type="submit">Send message</button>
          </div>
        </form>
      </div>
    </main>

    <footer class="footer">
      <div class="container">© LumenShop test store — not a real shop.</div>
    </footer>
    <script src="/js/app.js"></script>
  </body>
</html>
